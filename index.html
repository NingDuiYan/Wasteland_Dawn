<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>求生</title>
    <!-- 标签页图标也是代码画的（内联 SVG），仓库里依旧没有任何图片文件 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23151310'/%3E%3Cpath d='M16 5v22M5 16h22' stroke='%23c9a227' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23e8dcc8' stroke-width='2'/%3E%3C/svg%3E"
    />
    <style>
      /* 界面色板：废土/锈铁/木料/沙线四色直接取 src/config.ts 的 PALETTE，
         文字与强调色沿用既有 HUD 的三个值，避免屏幕层与 HUD 是两种观感 */
      :root {
        --ui-text: #e8dcc8;
        --ui-dim: rgba(232, 220, 200, 0.62);
        --ui-line: rgba(232, 220, 200, 0.16);
        --ui-accent: #ffd166;
        --ui-warn: #ff8a5c;
        --ui-rust: #8a4a2c;
        --ui-wood: #7a5c3c;
        --ui-metal: #585856;
        --ui-sand: #a8975a;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0d10;
        overflow: hidden;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: var(--ui-text);
      }
      #game-root { width: 100vw; height: 100vh; }
      #game-root canvas { display: block; }

      /* HUD 不拦截鼠标：射击全靠 pointerlock，任何覆盖层都不能吃掉点击 */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        user-select: none;
        transition: opacity 0.18s linear;
      }

      /* 受击红闪：径向渐变只压边缘，中间留出来看清敌人 */
      #hud-hurt {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(circle at 50% 50%, rgba(150, 20, 16, 0) 42%, rgba(150, 20, 16, 0.75) 100%);
        transition: opacity 0.08s linear;
      }

      /* 准星：四条短线留出中心空洞，命中标记在中心叠一个 X */
      #hud-crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 22px;
        height: 22px;
        margin: -11px 0 0 -11px;
        opacity: 0;
      }
      #hud-crosshair span {
        position: absolute;
        background: rgba(240, 232, 214, 0.85);
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.9);
      }
      #hud-crosshair .n, #hud-crosshair .s { left: 10px; width: 2px; height: 7px; }
      #hud-crosshair .n { top: 0; }
      #hud-crosshair .s { bottom: 0; }
      #hud-crosshair .w, #hud-crosshair .e { top: 10px; height: 2px; width: 7px; }
      #hud-crosshair .w { left: 0; }
      #hud-crosshair .e { right: 0; }
      #hud-hit-marker {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 18px;
        height: 18px;
        margin: -9px 0 0 -9px;
        opacity: 0;
        transform: rotate(45deg);
        transition: opacity 0.1s linear;
      }
      #hud-hit-marker::before, #hud-hit-marker::after {
        content: "";
        position: absolute;
        background: #ffd166;
      }
      #hud-hit-marker::before { left: 8px; top: 0; width: 2px; height: 18px; }
      #hud-hit-marker::after { top: 8px; left: 0; height: 2px; width: 18px; }
      #hud-hit-marker.is-on { opacity: 1; }

      /* 血量：左下角，条 + 数字 */
      #hud-health {
        position: absolute;
        left: 24px;
        bottom: 24px;
        width: 208px;
        padding: 10px 12px;
        background: rgba(12, 14, 18, 0.62);
        border: 1px solid rgba(232, 220, 200, 0.16);
        border-radius: 8px;
        backdrop-filter: blur(6px);
      }
      #hud-health .label {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: rgba(232, 220, 200, 0.62);
        margin-bottom: 6px;
      }
      #hud-health .bar {
        height: 8px;
        border-radius: 4px;
        background: rgba(232, 220, 200, 0.12);
        overflow: hidden;
      }
      #hud-hp-fill {
        height: 100%;
        width: 100%;
        border-radius: 4px;
        background: linear-gradient(90deg, #7fbf5a, #c8d25a);
        transition: width 0.12s linear, background 0.2s linear;
      }

      /* 弹药：右下角。武器名与投掷数都挂在这个盒子里，看一处就够 */
      #hud-ammo-box {
        position: absolute;
        right: 24px;
        bottom: 24px;
        min-width: 132px;
        padding: 10px 14px;
        text-align: right;
        background: rgba(12, 14, 18, 0.62);
        border: 1px solid rgba(232, 220, 200, 0.16);
        border-radius: 8px;
        backdrop-filter: blur(6px);
      }
      #hud-ammo-box .label {
        font-size: 11px;
        letter-spacing: 0.08em;
        color: rgba(232, 220, 200, 0.62);
      }
      #hud-weapon {
        margin-bottom: 6px;
        font-size: 12px;
        letter-spacing: 0.06em;
        white-space: nowrap;
        color: var(--ui-text);
      }
      #hud-ammo {
        font-size: 26px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
        color: #ffd166;
      }
      #hud-ammo.is-reloading { color: rgba(232, 220, 200, 0.45); }
      /* 近战/投掷槽没有弹匣，显示一个破折号就够，不要写 0 让人以为没子弹 */
      #hud-ammo.is-empty { color: rgba(232, 220, 200, 0.5); }
      #hud-throw-row {
        display: flex;
        justify-content: flex-end;
        align-items: baseline;
        gap: 6px;
        margin-top: 6px;
        font-size: 11px;
        letter-spacing: 0.04em;
        color: rgba(232, 220, 200, 0.62);
      }
      #hud-throw {
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        color: rgba(232, 220, 200, 0.88);
      }
      #hud-throw.is-empty { color: rgba(232, 220, 200, 0.3); }

      /* 顶部信息条：时间 / 天气 / 击杀 / FPS */
      #hud-top {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 18px;
        padding: 8px 18px;
        background: rgba(12, 14, 18, 0.62);
        border: 1px solid rgba(232, 220, 200, 0.16);
        border-radius: 999px;
        backdrop-filter: blur(6px);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: rgba(232, 220, 200, 0.78);
      }
      #hud-top b { color: #e8dcc8; font-weight: 600; }

      #hud-status {
        position: absolute;
        top: 58%;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 20px;
        background: rgba(12, 14, 18, 0.72);
        border: 1px solid rgba(232, 220, 200, 0.18);
        border-radius: 8px;
        font-size: 14px;
        letter-spacing: 0.04em;
        color: #ffd166;
        opacity: 0;
        transition: opacity 0.2s linear;
      }
      #hud-status.is-on { opacity: 1; }

      /* ---------- 全屏界面层：加载 / 菜单 / 选装备 / 选地图 / 暂停 / 结算 ----------
         z-index 20 让它们压在 #hud 与 #weather-tabs 之上；层本身不吃鼠标，
         只有按钮、卡片与 .screen-inner（滚动容器）自己开 auto —— 和 #hud 一个规矩。
         底色必须不透明：这些都是「还没进游戏」的层，透出后面的世界等于让玩家
         提前看见自己还没选的那张地图（暂停/结算另有半透明背景，属故意） */
      .screen {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        padding: 24px;
        overflow-y: auto;
        pointer-events: none;
        color: var(--ui-text);
        background: radial-gradient(circle at 50% 38%, #14120f, #08090b 78%);
      }
      .screen.is-on { display: flex; }
      /* margin:auto 而不是 justify-content:center：内容比视口高时 auto 归零，
         从顶部开始排并滚到底，居中写法会把顶部内容顶到看不见的地方 */
      .screen-inner {
        margin: auto;
        width: 100%;
        max-width: 1040px;
        pointer-events: auto;
      }

      .screen-head h2 {
        margin: 0 0 4px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.18em;
      }
      .screen-head p {
        margin: 0 0 16px;
        font-size: 11px;
        line-height: 1.7;
        letter-spacing: 0.04em;
        color: var(--ui-dim);
      }
      .screen-foot {
        display: flex;
        justify-content: flex-end;
        margin-top: 16px;
      }

      /* 按钮：hover / focus-visible / disabled 三态齐全，键盘 Tab 能一路走完 */
      .btn {
        pointer-events: auto;
        padding: 11px 26px;
        border: 1px solid rgba(232, 220, 200, 0.26);
        border-radius: 8px;
        background: rgba(232, 220, 200, 0.06);
        color: var(--ui-text);
        font: inherit;
        font-size: 13px;
        letter-spacing: 0.12em;
        cursor: pointer;
        transition: background 0.15s linear, border-color 0.15s linear, color 0.15s linear;
      }
      .btn:hover { background: rgba(232, 220, 200, 0.14); border-color: rgba(232, 220, 200, 0.44); }
      .btn:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 2px; }
      .btn:disabled { opacity: 0.42; cursor: not-allowed; }
      .btn-primary {
        border-color: rgba(255, 209, 102, 0.5);
        background: rgba(255, 209, 102, 0.12);
        color: var(--ui-accent);
        font-weight: 600;
      }
      .btn-primary:hover { background: rgba(255, 209, 102, 0.22); border-color: rgba(255, 209, 102, 0.8); }

      /* ---------- 加载页：聚光灯下悬空的木牌，整屏由 canvas 生成 ----------
         进度不画进度条：设计稿要的是"灯慢慢亮起来"本身当反馈 ——
         0% 只看得到铁链轮廓，50% 木纹与锈迹浮出来，100% 全细节清晰。
         src/ui/loadingBackdrop.ts 收一个 0..1 的亮度，画面里没有一个能读秒的控件。
         两层：canvas（场景）→ .loading-scrim（灯罩漏光 + 重暗角，压成"透过脏镜头看"）。
         这一屏没有标题也没有状态行，与参考图一致 —— 别再加回来。 */
      #screen-loading {
        padding: 0;
        overflow: hidden;
        background: #050506;
      }
      #screen-loading.is-on { display: block; }
      #loading-scene {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      .loading-scrim {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        /* 这里刻意不放 .menu-scrim 那层湍流颗粒：它在暗部会垫起 15 左右的灰，
           整屏就读成"灰雾"而不是"黑洞"（量过：加颗粒后角落 16.9，去掉 2.2）。
           底噪云交给 canvas 里的 mottle，那一层只在 5 上下，是参考图的量级 */
        background-image:
          radial-gradient(ellipse 26% 22% at 50% -3%, rgba(250, 247, 239, 0.06) 0%, rgba(5, 5, 6, 0) 70%),
          radial-gradient(ellipse at 50% 42%, rgba(5, 5, 6, 0) 20%, rgba(5, 5, 6, 0.8) 72%, rgba(1, 1, 2, 0.97) 100%);
        background-size: 100% 100%, 100% 100%;
      }
      /* 这一页刻意一个字都没有：参考图里就是一片黑与一束灯，
         进度只由灯亮到哪儿表达（setLoading 只递亮度，没有文案通道） */

      /* ---------- 主菜单：夜雾 + 手电，画面全部由代码生成 ----------
         三层叠出来：#menu-backdrop（canvas，src/ui/menuBackdrop.ts 画的雾/浮尘/闪电）
         → .menu-scrim（暗角 + 扫描线 + 颗粒，把画布压成"透过脏镜头看"）
         → .menu-inner（文字与按钮，吃指针视差：脚本写 --par-x / --par-y）。
         这一层必须不透明：玩家还没选地图，底下不存在任何世界 */
      #screen-menu { background: #050506; }
      #menu-backdrop {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }
      .menu-scrim {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        /* 设计稿的顶光是一道"窄而长"的光柱：横向 FWHM 只有 20% 画面宽，
           竖向却一直照到画面 30% 处才收干净。所以拆成两层 —— 窄锥管横向衰减，
           长锥管竖向拖尾 —— 再加一层标题背后的光池与四角压黑。
           颗粒叠在最上层，它的 0.02 亮度就是整张图"最暗处"的底噪 */
        background-image:
          url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'180'%20height%3D'180'%3E%3Cfilter%20id%3D'f'%3E%3CfeTurbulence%20type%3D'fractalNoise'%20baseFrequency%3D'0.8'%20numOctaves%3D'3'%20stitchTiles%3D'stitch'%2F%3E%3CfeColorMatrix%20type%3D'saturate'%20values%3D'0'%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D'180'%20height%3D'180'%20filter%3D'url(%23f)'%20opacity%3D'0.11'%2F%3E%3C%2Fsvg%3E"),
          radial-gradient(ellipse 46% 62% at 50% -16%, rgba(250, 247, 239, 0.32) 0%, rgba(222, 217, 205, 0.1) 38%, rgba(5, 5, 6, 0) 72%),
          radial-gradient(ellipse 22% 46% at 50% -8%, rgba(255, 252, 244, 0.16) 0%, rgba(5, 5, 6, 0) 72%),
          radial-gradient(ellipse 34% 27% at 50% 30%, rgba(236, 231, 219, 0.13) 0%, rgba(5, 5, 6, 0) 76%),
          radial-gradient(ellipse at 50% 42%, rgba(5, 5, 6, 0) 16%, rgba(5, 5, 6, 0.8) 76%, rgba(3, 3, 4, 0.97) 100%);
        background-size: 180px 180px, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
      }
      /* 中间这一列：标题 + 三块木牌；指针视差 9px 由脚本写进 --par-x / --par-y */
      .menu-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 1200px;
        transform: translate3d(calc(var(--par-x, 0) * 9px), calc(var(--par-y, 0) * 9px), 0);
      }
      .menu-head {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 11px;
      }
      .menu-actions {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* 标题是一块被凿开的石板：石面是三层湍流（细颗粒 / 高光屑 / 大色斑）+ 135° 侧光，
         崩边交给 SVG 位移滤镜，裂纹由 ::before 再画一遍同一段字 —— 全是代码 */
      .menu-title-wrap {
        position: relative;
        /* 设计稿「求生」的墨迹是 435x274@1280x720；29.4vh 的字号再纵向拉 1.41 倍正好是 274px 高 */
        font-size: clamp(96px, min(29.4vh, 21vw), 340px);
        line-height: 1;
        /* 侧壁是"台阶"不是"倒角"：2.4px 一档、四档压到近黑，最后一条 1.4px 的亮线
           落在最外沿（新断口反光）；blur 那一层只当落地影。
           drop-shadow 吃的是整棵子树的 alpha，所以和 background-clip:text 不打架 */
        filter:
          drop-shadow(3px 3.2px 0 rgb(158, 152, 140))
          drop-shadow(3px 3.2px 0 rgb(112, 107, 98))
          drop-shadow(3px 3.2px 0 rgb(70, 66, 59))
          drop-shadow(3px 3.2px 0 rgb(42, 39, 34))
          drop-shadow(0 12px 18px rgba(0, 0, 0, 0.72));
      }
      .menu-title {
        position: relative;
        margin: 0;
        /* 参考图的字形是重宋：横细竖粗、收笔是切的。系统里最接近的是华文中宋 */
        font-family: 'STZhongsong', 'STSong', 'SimSun', 'Songti SC', 'Noto Serif SC', serif;
        font-size: 1em;
        /* 900 会把合成加粗糊成一块，700 才留得住横细竖粗的层次 */
        font-weight: 700;
        /* 两个字之间只有 7px 缝（设计稿量出 15px@2730），字距必须收得很紧 */
        letter-spacing: 0.03em;
        text-indent: 0.03em;
        background-color: #cfcac1;
        /* 石感是三件事同时成立：2-6px 细颗粒、稀疏的高光屑、50-300px 的大色斑。
           只有最粗那一层会读成"涂了色的薄膜"，所以三层都要 */

9%2095.2%20Z'%20fill%3D'%23f6f2e8'%20opacity%3D'0.42'%2F%3E%3Cpath%20d%3D'M148.4%2061.1%20L166.9%2088.2%20L159.7%20111.9%20L160.3%20112.1%20L169.1%2087.8%20L151.6%2058.9%20Z'%20fill%3D'%230b0a08'%20opacity%3D'0.92'%2F%3E%3Cpath%20d%3D'M150.7%2060.4%20L168.9%2088.1%20L161.2%20111.9%20L161.6%20112.1%20L169.9%2087.9%20L152.1%2059.6%20Z'%20fill%3D'%23f6f2e8'%20opacity%3D'0.42'%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");

      }
      /* 「生」中间那一竖换成枯树：树根压在字底，树干盖住竖笔，所以树干要比笔画宽 */
      .menu-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
      /* 每 8.6 秒抖一次光：像坏掉的灯，不是故障动画 */
      @keyframes title-flicker {
        0%, 94%, 96%, 97.5%, 100% { opacity: 1; }
        94.6% { opacity: 0.62; }
        95.2% { opacity: 0.88; }
        96.6% { opacity: 0.74; }
      }
      /* 设计稿上只有「求生」两个大字：英文名保留在 DOM 里给读屏与搜索，
         视觉上收成一个 1px 的块，不让它挤进标题的呼吸空间 */
      .menu-subtitle {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        color: var(--ui-accent);
      }
      /* 三个入口是挂在铁链上的木牌：木纹是渐变 + 湍流噪声，铁链是 symbol 里三个环，
         没有任何图片文件。牌子各自歪一点，像被风吹过的招牌 */
      .plank {
        position: relative;
        padding-top: 26px;
        /* 倾角 = 各自的静态歪斜 + 钟摆角度：钟摆每帧由 plankSwing.ts 写进 --swing */
        transform: rotate(calc(var(--tilt, 0deg) + var(--swing, 0deg)));
        transform-origin: 50% 0;
        /* backwards 而不是 both：入场动画放完就把 transform 交还给上面的 CSS，钟摆才摆得动 */
        animation: plank-drop 0.9s cubic-bezier(0.22, 1, 0.36, 1) backwards;
      }
      .plank:nth-child(1) { --tilt: -1.2deg; animation-delay: 0.26s; }
      .plank:nth-child(2) { --tilt: 0.8deg; animation-delay: 0.38s; }
      .plank:nth-child(3) { --tilt: -0.6deg; animation-delay: 0.5s; }
      .plank-chain {
        position: absolute;
        top: 0;
        width: 9px;
        height: 26px;
        color: #6f675c;
        filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.85));
        pointer-events: none;
      }
      .plank-chain--l { left: calc(50% - 76px); }
      .plank-chain--r { right: calc(50% - 76px); }
      .plank-btn {
        position: relative;
        display: block;
        width: 204px;
        height: 76px;
        padding: 0;
        border: 0;
        color: #1d1208;
        font-family: 'STKaiti', 'KaiTi', 'STSong', 'SimSun', serif;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-indent: 0.14em;
        cursor: pointer;
        /* 凿进木头里的字：上沿被压出暗边，下沿接一道亮边 */
        text-shadow: 0 -1px 1px rgba(0, 0, 0, 0.68), 0 1px 0 rgba(206, 166, 118, 0.34);
        background-color: #6b4a2e;
        background-image:
          radial-gradient(circle at 16% 12%, #a49a8c 0 2px, #6d655b 2px 2.7px, rgba(0, 0, 0, 0) 3.1px),
          radial-gradient(circle at 84% 12%, #a49a8c 0 2px, #6d655b 2px 2.7px, rgba(0, 0, 0, 0) 3.1px),
          url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'150'%20height%3D'150'%3E%3Cfilter%20id%3D'w'%3E%3CfeTurbulence%20type%3D'fractalNoise'%20baseFrequency%3D'0.16%200.62'%20numOctaves%3D'5'%20stitchTiles%3D'stitch'%2F%3E%3CfeColorMatrix%20type%3D'saturate'%20values%3D'0'%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D'150'%20height%3D'150'%20filter%3D'url(%23w)'%20opacity%3D'0.5'%2F%3E%3C%2Fsvg%3E"),
          repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.2) 0 1px, rgba(0, 0, 0, 0) 1px 4px, rgba(0, 0, 0, 0.13) 4px 5px, rgba(0, 0, 0, 0) 5px 11px),
          repeating-linear-gradient(0deg, rgba(255, 216, 168, 0.07) 0 1px, rgba(0, 0, 0, 0) 1px 9px),
          radial-gradient(ellipse 90% 130% at 50% 44%, rgba(28, 18, 10, 0) 40%, rgba(24, 15, 8, 0.55) 100%),
          linear-gradient(180deg, #7d5a36 0%, #613f24 26%, #452e1a 64%, #25170d 100%);
        background-size: 150px 150px, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
        box-shadow: inset 0 0 0 1.5px rgba(20, 13, 7, 0.5), inset 0 2px 0 rgba(255, 214, 164, 0.14);
        /* 二十三点折线：两端被锯过、边缘被磕过，圆角矩形会立刻变成网页按钮 */
        clip-path: polygon(2% 9%, 15% 4%, 31% 7%, 48% 3%, 64% 6%, 80% 3%, 94% 7%, 99% 17%, 97% 33%, 100% 53%, 98% 73%, 99% 88%, 93% 95%, 79% 92%, 63% 96%, 46% 93%, 29% 96%, 13% 92%, 4% 95%, 0% 85%, 2% 65%, 0% 43%, 1% 21%);
        /* clip-path 会把 box-shadow 一起剪掉，所以投影只能走 filter */
        filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.75));
        transition: filter 0.18s ease-out, transform 0.18s ease-out;
      }
      #menu-start { animation: plank-glow 6.4s ease-in-out infinite; }
      #menu-start:hover {
        animation: none;
        filter: drop-shadow(0 13px 16px rgba(0, 0, 0, 0.78)) drop-shadow(0 0 22px rgba(255, 186, 112, 0.28));
      }
      #menu-start:active { transform: scale(0.985); }
      @keyframes plank-glow {
        0%, 100% { filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.75)); }
        50% { filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.75)) drop-shadow(0 0 16px rgba(255, 178, 104, 0.16)); }
      }
      /* 没做的入口先灰一点，但仍然是一块牌子：hover 抬亮并给出提示 */
      .plank-btn:disabled {
        cursor: default;
        opacity: 0.9;
        filter: drop-shadow(0 9px 13px rgba(0, 0, 0, 0.72));
      }
      .plank-btn:disabled:hover { opacity: 1; }
      .plank-btn:focus-visible {
        outline: none;
        filter: drop-shadow(0 0 3px rgba(255, 209, 102, 0.95)) drop-shadow(0 0 16px rgba(255, 209, 102, 0.5));
      }

      /* 还没做的入口不装死：hover 时浮一行小字说明，别让人以为是坏了 */
      .plank-btn[data-tip]::after {
        content: attr(data-tip);
        position: absolute;
        /* 牌子上下挨得近，提示放右边才不会压到下一块 */
        left: calc(100% + 14px);
        top: 50%;
        transform: translateY(-50%);
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 10px;
        letter-spacing: 0.14em;
        white-space: nowrap;
        color: rgba(232, 220, 200, 0.5);
        opacity: 0;
        transition: opacity 0.18s linear;
        pointer-events: none;
      }
      .plank-btn[data-tip]:hover::after { opacity: 1; }

      /* 版本号：设计稿上没这东西，但查问题时必须有 —— 收成 1px 留在 DOM 里 */
      .menu-version {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        margin: 0;
        font-size: 10px;
        letter-spacing: 0.14em;
        color: rgba(232, 220, 200, 0.22);
        animation: menu-fade 1.2s linear 0.5s both;
      }
      @keyframes menu-fade {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      /* 选装备：一个槽位一行，行内两张卡片并排 */
      .loadout-slots {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .slot-row {
        padding: 10px 12px;
        border: 1px solid var(--ui-line);
        border-radius: 10px;
        background: rgba(232, 220, 200, 0.03);
      }
      .slot-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 8px;
      }
      .slot-name {
        font-size: 12px;
        letter-spacing: 0.1em;
        color: var(--ui-text);
      }
      .slot-hint {
        font-size: 11px;
        line-height: 1.6;
        color: var(--ui-dim);
      }
      .slot-cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .card {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 8px 10px;
        border: 1px solid var(--ui-line);
        border-radius: 8px;
        background: rgba(232, 220, 200, 0.04);
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
        pointer-events: auto;
        transition: background 0.15s linear, border-color 0.15s linear;
      }
      .card:hover { background: rgba(232, 220, 200, 0.1); border-color: rgba(232, 220, 200, 0.32); }
      .card:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 2px; }
      .card[aria-pressed='true'] {
        border-color: rgba(255, 209, 102, 0.72);
        background: rgba(255, 209, 102, 0.12);
      }
      .card-icon {
        display: block;
        flex: 0 0 auto;
        width: 120px;
        height: 72px;
        border: 1px solid rgba(232, 220, 200, 0.08);
        border-radius: 6px;
        background: linear-gradient(180deg, rgba(232, 220, 200, 0.05), rgba(11, 13, 16, 0.4));
      }
      .card-body { min-width: 0; }
      .card-name { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
      .card-desc {
        margin: 3px 0 6px;
        font-size: 11px;
        line-height: 1.55;
        color: var(--ui-dim);
      }
      .card-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        font-size: 11px;
        color: rgba(232, 220, 200, 0.55);
      }
      .card-stats b {
        color: var(--ui-accent);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      /* 选地图：卡片底色走 MapDef 的 tint 渐变，canvas 只叠一层剪影 */
      .map-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 14px;
      }
      .map-card {
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 0;
        overflow: hidden;
        border: 1px solid var(--ui-line);
        border-radius: 10px;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
        pointer-events: auto;
        transition: border-color 0.15s linear, box-shadow 0.15s linear;
      }
      .map-card:hover { border-color: rgba(232, 220, 200, 0.38); }
      .map-card:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 2px; }
      .map-card[aria-pressed='true'] {
        border-color: rgba(255, 209, 102, 0.75);
        box-shadow: 0 0 0 1px rgba(255, 209, 102, 0.45);
      }
      /* 锁定项：灰度压暗 + 角标，button 直接 disabled，键盘也走不进去 */
      .map-card.is-locked {
        filter: grayscale(1) brightness(0.58);
        cursor: not-allowed;
        pointer-events: none;
      }
      .map-art {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 6;
      }
      .map-body {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 10px 12px 12px;
        background: rgba(6, 7, 9, 0.72);
      }
      .map-name { font-size: 14px; font-weight: 600; letter-spacing: 0.06em; }
      .map-sub { font-size: 11px; letter-spacing: 0.04em; color: var(--ui-accent); }
      .map-desc {
        margin: 2px 0 0;
        font-size: 11px;
        line-height: 1.6;
        color: var(--ui-dim);
      }
      .map-badge {
        position: absolute;
        top: 8px;
        right: 8px;
        padding: 3px 9px;
        border: 1px solid rgba(232, 220, 200, 0.32);
        border-radius: 999px;
        background: rgba(6, 7, 9, 0.82);
        font-size: 10px;
        letter-spacing: 0.08em;
        color: rgba(232, 220, 200, 0.8);
      }

      /* 暂停层整块就是「点击继续」的命中区：这里必须吃鼠标，
         否则点击会穿透到画布变成开火 */
      #screen-pause {
        pointer-events: auto;
        cursor: pointer;
        background: rgba(6, 7, 9, 0.6);
      }
      #screen-pause .screen-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        max-width: 640px;
        text-align: center;
      }
      .pause-hit {
        padding: 8px 16px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--ui-text);
        font: inherit;
        font-size: clamp(20px, 3vw, 26px);
        letter-spacing: 0.24em;
        text-indent: 0.24em;
        cursor: pointer;
      }
      .pause-hit:hover { color: var(--ui-accent); }
      .pause-hit:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 3px; }
      .pause-hint {
        margin: 0;
        font-size: 11px;
        line-height: 1.9;
        letter-spacing: 0.04em;
        color: var(--ui-dim);
      }

      /* 结算 */
      #screen-result {
        background: radial-gradient(circle at 50% 40%, rgba(30, 14, 11, 0.5), rgba(6, 7, 9, 0.92));
      }
      #screen-result .screen-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        max-width: 460px;
        text-align: center;
      }
      .result-title {
        margin: 0;
        font-size: clamp(28px, 5vw, 42px);
        font-weight: 600;
        letter-spacing: 0.22em;
        text-indent: 0.22em;
        color: var(--ui-warn);
      }
      .result-stats { display: flex; gap: 34px; margin: 0; }
      .result-stats > div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .result-stats dt {
        font-size: 11px;
        letter-spacing: 0.12em;
        color: var(--ui-dim);
      }
      .result-stats dd {
        margin: 0;
        font-size: 26px;
        font-variant-numeric: tabular-nums;
        color: var(--ui-accent);
      }
      .result-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }

      /* 天气选项卡：HUD 是 pointer-events:none，这块单独打开；
         而且只在局内出现，菜单/结算时它既没用又会盖住界面 */
      #weather-tabs {
        position: fixed;
        top: 16px;
        right: 16px;
        display: flex;
        gap: 6px;
        padding: 8px;
        pointer-events: auto;
        background: rgba(12, 14, 18, 0.62);
        border: 1px solid rgba(232, 220, 200, 0.16);
        border-radius: 8px;
        backdrop-filter: blur(6px);
        z-index: 10;
      }
      #weather-tabs button {
        padding: 6px 14px;
        border: 1px solid rgba(232, 220, 200, 0.22);
        border-radius: 6px;
        background: rgba(232, 220, 200, 0.06);
        color: rgba(232, 220, 200, 0.72);
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.04em;
        cursor: pointer;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }
      #weather-tabs button:hover { background: rgba(232, 220, 200, 0.14); color: #e8dcc8; }
      #weather-tabs button[aria-pressed='true'] {
        background: rgba(255, 209, 102, 0.16);
        border-color: rgba(255, 209, 102, 0.6);
        color: #ffd166;
      }
      #weather-tabs button:focus-visible { outline: 2px solid #ffd166; outline-offset: 1px; }

      /* 非局内：HUD 与天气选项卡都收起来，把画面让给菜单与结算 */
      body:not(.is-playing) #weather-tabs { display: none; }
      body:not(.is-playing) #hud { opacity: 0; }

      .fatal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        text-align: center;
        color: var(--ui-warn);
        font-size: 14px;
        line-height: 1.9;
      }

      /* 系统开了"减少动态效果"时，过渡与动画一律取消，只留状态本身 */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-root">
      <!-- 六层全屏界面：加载层默认 .is-on，脚本没起来也能看到第一屏；
           其余层由 src/ui/screens.ts 独占开关，同一时刻只有一层带 .is-on -->
      <div id="screen-loading" class="screen is-on">
        <!-- 聚光灯、铁链、木牌、灰烬与刻石全画在这块 canvas 上（src/ui/loadingBackdrop.ts）；
             进度就是灯的亮度，所以这一层没有任何进度条 -->
        <canvas id="loading-scene" aria-hidden="true"></canvas>
        <div class="loading-scrim" aria-hidden="true"></div>
      </div>

      <div id="screen-menu" class="screen">
        <canvas id="menu-backdrop" aria-hidden="true"></canvas>
        <div class="menu-scrim" aria-hidden="true"></div>
        <!-- 位移滤镜的滤镜体：把标题的轮廓啃出毛刺，像被风化过的石边 -->
        <svg class="menu-defs" aria-hidden="true" focusable="false" width="0" height="0">
          <defs>
            <symbol id="menu-chain" viewBox="0 0 8 26">
              <!-- 竖环与横环交替且互相咬合：光看三个不重叠的椭圆会像一串珠子 -->
              <g fill="none" stroke="currentColor" stroke-width="1.2">
                <ellipse cx="4" cy="3.6" rx="2.3" ry="3.4" />
                <ellipse cx="4" cy="8.2" rx="2.9" ry="2.1" />
                <ellipse cx="4" cy="12.8" rx="2.3" ry="3.4" />
                <ellipse cx="4" cy="17.4" rx="2.9" ry="2.1" />
                <ellipse cx="4" cy="22" rx="2.3" ry="3.4" />
              </g>
            </symbol>
            <filter id="menu-stone" x="-14%" y="-14%" width="128%" height="128%" color-interpolation-filters="sRGB">
              <!-- 大崩口要棱角：turbulence 给折线，fractalNoise 只会给圆滑起伏。
                   baseFrequency 的横向/纵向比例抵消了 scaleY(1.41)，否则竖向咬痕会长 41% -->
              <feTurbulence type="turbulence" baseFrequency="0.03 0.032" numOctaves="2" seed="11" result="chip" />
              <feDisplacementMap in="SourceGraphic" in2="chip" scale="4.4" xChannelSelector="R" yChannelSelector="G" result="chipped" />
              <feTurbulence type="fractalNoise" baseFrequency="0.16 0.17" numOctaves="2" seed="5" result="bite" />
              <feDisplacementMap in="chipped" in2="bite" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
            </filter>
          </defs>
        </svg>
        <div class="screen-inner menu-inner">
          <div class="menu-head">
            <p id="menu-subtitle" class="menu-subtitle">Survival</p>
            <div class="menu-title-wrap">
              <h1 id="menu-title" class="menu-title" data-text="求生">求生</h1>
            </div>
          </div>
          <div class="menu-actions">
            <div class="plank">
              <svg class="plank-chain plank-chain--l" viewBox="0 0 8 26" aria-hidden="true" focusable="false"><use href="#menu-chain" /></svg>
              <svg class="plank-chain plank-chain--r" viewBox="0 0 8 26" aria-hidden="true" focusable="false"><use href="#menu-chain" /></svg>
              <button id="menu-start" class="plank-btn" type="button">开始游戏</button>
            </div>
            <div class="plank">
              <svg class="plank-chain plank-chain--l" viewBox="0 0 8 26" aria-hidden="true" focusable="false"><use href="#menu-chain" /></svg>
              <svg class="plank-chain plank-chain--r" viewBox="0 0 8 26" aria-hidden="true" focusable="false"><use href="#menu-chain" /></svg>
              <button id="menu-settings" class="plank-btn" type="button" data-tip="即将开放" aria-label="设置（即将开放）" disabled>设置</button>
            </div>
            <div class="plank">
              <svg class="plank-chain plank-chain--l" viewBox="0 0 8 26" aria-hidden="true" focusable="false"><use href="#menu-chain" /></svg>
              <svg class="plank-chain plank-chain--r" viewBox="0 0 8 26" aria-hidden="true" focusable="false"><use href="#menu-chain" /></svg>
              <button id="menu-quit" class="plank-btn" type="button" data-tip="即将开放" aria-label="退出（即将开放）" disabled>退出</button>
            </div>
          </div>
        </div>
        <p id="menu-version" class="menu-version">v0.3.0</p>
      </div>

      <div id="screen-loadout" class="screen">
        <div class="screen-inner">
          <div class="screen-head">
            <h2>选装备</h2>
            <p>四个槽位各挑一件，进游戏后用数字键 1-4 切换</p>
          </div>
          <div id="loadout-slots" class="loadout-slots"></div>
          <div class="screen-foot">
            <button id="loadout-next" class="btn btn-primary" type="button">下一步</button>
          </div>
        </div>
      </div>

      <div id="screen-map" class="screen">
        <div class="screen-inner">
          <div class="screen-head">
            <h2>选地图</h2>
            <p>只有清理干净的据点能进，其余区域还在封锁中</p>
          </div>
          <div id="map-grid" class="map-grid"></div>
          <div class="screen-foot">
            <button id="map-start" class="btn btn-primary" type="button">开始探险</button>
          </div>
        </div>
      </div>

      <div id="screen-pause" class="screen">
        <div class="screen-inner">
          <button id="pause-resume" class="pause-hit" type="button">点击继续</button>
          <p class="pause-hint">WASD 移动 · 鼠标左键开火 · 1-4 换武器 · R 换弹 · Shift 疾跑 · P 切天气</p>
        </div>
      </div>

      <div id="screen-result" class="screen">
        <div class="screen-inner">
          <h2 class="result-title">你倒下了</h2>
          <dl class="result-stats">
            <div><dt>存活时长</dt><dd id="result-survived">00:00</dd></div>
            <div><dt>击杀数</dt><dd id="result-kills">0</dd></div>
          </dl>
          <div class="result-actions">
            <button id="result-retry" class="btn btn-primary" type="button">再来一次</button>
            <button id="result-menu" class="btn" type="button">返回主菜单</button>
          </div>
        </div>
      </div>
    </div>

    <div id="hud">
      <div id="hud-crosshair">
        <span class="n"></span><span class="s"></span><span class="w"></span><span class="e"></span>
      </div>
      <div id="hud-hit-marker"></div>

      <div id="hud-top">
        <span>时间 <b id="hud-clock">--</b></span>
        <span>天气 <b id="hud-weather">--</b></span>
        <span>击杀 <b id="hud-kills">0</b></span>
        <span>FPS <b id="hud-fps">--</b></span>
      </div>

      <div id="hud-health">
        <div class="label"><span>生命</span><b id="hud-hp-text">100</b></div>
        <div class="bar"><div id="hud-hp-fill"></div></div>
      </div>

      <div id="hud-ammo-box">
        <div id="hud-weapon">—</div>
        <div class="label">弹匣</div>
        <div id="hud-ammo">12</div>
        <div id="hud-throw-row">投掷 <b id="hud-throw">—</b></div>
      </div>

      <div id="hud-status"></div>
    </div>

    <div id="hud-hurt"></div>

    <div id="weather-tabs" role="group" aria-label="天气选择"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
